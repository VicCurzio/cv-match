name: Verify

# The pre-commit hook can be skipped with --no-verify; this cannot.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # oxlint, tsc, the layer guard with its self-test, and the suite.
      - run: npm run verify
