name: Verify

# The pre-commit hook can be skipped with --no-verify; this cannot.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # oxlint, tsc, the layer guard with its self-test, and the suite.
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      # The flows a person goes through, in a real browser, against the production
      # build: routes and Back, versions, the preview under the CSP, two tabs.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
