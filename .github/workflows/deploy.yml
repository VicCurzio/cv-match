name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nothing ships that has not passed the same checks as a local commit.
      - run: npm run verify
      - run: npm run build
      # A missing 404.html or relative asset URLs only break on Pages, on every
      # address but the home page. This is the one place that can catch it.
      - run: npm run check:build
      # Nothing is published that fails in a real browser either.
      - run: npx playwright install --with-deps chromium
      # The flows a person goes through, in a real browser, against the production
      # build: routes and Back, versions, the preview under the CSP, two tabs.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
